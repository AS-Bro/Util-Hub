<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Util-Hub</title>
<meta name="description" content="A central dashboard for everyday utility tools." />
<link rel="icon" type="image/png" href="images/UH_2.png" />

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap"
  rel="stylesheet"
/>

<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    darkMode: 'class',
    theme: {
      extend: {
        colors: {
          bg: 'var(--bg)',
          panel: 'var(--bg-panel)',
          elevated: 'var(--bg-elevated)',
          line: 'var(--line)',
          'line-strong': 'var(--line-strong)',
          ink: 'var(--text)',
          muted: 'var(--text-muted)',
          faint: 'var(--text-faint)',
          accent: 'var(--accent)',
          'accent-strong': 'var(--accent-strong)',
          signal: 'var(--signal)',
          'signal-strong': 'var(--signal-strong)',
        },
        fontFamily: {
          display: ['"Space Grotesk"', 'sans-serif'],
          body: ['Inter', 'sans-serif'],
          mono: ['"IBM Plex Mono"', 'monospace'],
        },
        borderRadius: { card: '10px' }
      },
    },
  };
</script>

<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js" defer></script>

<style>
  body {
    background-color: var(--bg);
    color: var(--text);
    font-family: 'Inter', sans-serif;
  }

  /* Hide scrollbar for clean carousel navigation */
  .scrollbar-none::-webkit-scrollbar { display: none; }
  .scrollbar-none { -ms-overflow-style: none; scrollbar-width: none; }

  .card-frame { position: relative; }
  .corner {
    position: absolute;
    width: 10px;
    height: 10px;
    border-color: var(--line-strong);
    pointer-events: none;
  }
  .corner-tl { top: -1px; left: -1px; border-top: 2px solid; border-left: 2px solid; }
  .corner-tr { top: -1px; right: -1px; border-top: 2px solid; border-right: 2px solid; }
  .corner-bl { bottom: -1px; left: -1px; border-bottom: 2px solid; border-left: 2px solid; }
  .corner-br { bottom: -1px; right: -1px; border-bottom: 2px solid; border-right: 2px solid; }

  .tool-card {
    transition: border-color 0.15s ease, transform 0.15s ease;
  }
  .tool-card:hover .corner { border-color: var(--accent); }

  .favorite-btn[data-favorited="true"] .star-icon { fill: var(--signal); stroke: var(--signal); }
  .favorite-btn[data-favorited="false"] .star-icon { fill: none; }

  .modal-panel {
    opacity: 0;
    transform: translateY(8px) scale(0.98);
    transition: opacity 0.15s ease, transform 0.15s ease;
  }
  .modal-backdrop { opacity: 0; transition: opacity 0.15s ease; }
  .is-open .modal-backdrop { opacity: 1; }
  .is-open .modal-panel { opacity: 1; transform: translateY(0) scale(1); }

  .switch-track { background: var(--bg); border: 1px solid var(--line-strong); }
  .switch-knob { background: var(--accent); transition: transform 0.2s ease; }
  html.light .switch-knob { transform: translateX(18px); }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.001ms !important;
      transition-duration: 0.001ms !important;
    }
  }
</style>
</head>

<body>
  <!-- HEADER -->
  <header class="sticky top-0 z-30 border-b border-line bg-bg/90 backdrop-blur-md">
    <div class="mx-auto flex max-w-7xl flex-col gap-4 px-4 py-4 sm:px-6 lg:px-8">
      <div class="flex items-center justify-between gap-4">
        <a class="uh-dashboard-brand flex items-center gap-3" href="index.html" aria-label="Utility Hub home">
          <img class="uh-brand-logo" src="images/UH.png" alt="" width="38" height="38" />
          <div class="leading-tight">
            <h1 class="font-display text-lg font-semibold tracking-tight text-ink">Utility Hub</h1>
            <p class="font-mono text-[11px] uppercase tracking-widest text-faint">Sheet 01 — Everyday Tools</p>
          </div>
        </a>

        <div class="flex items-center gap-2 sm:gap-3">
          <button
            id="theme-toggle"
            type="button"
            role="switch"
            aria-checked="false"
            aria-label="Toggle light and dark theme"
            class="switch-track relative flex h-8 w-[52px] items-center rounded-full px-1"
          >
            <span class="switch-knob absolute left-1 flex h-6 w-6 items-center justify-center rounded-full text-bg">
              <i data-lucide="moon" class="h-3.5 w-3.5 dark:block hidden" aria-hidden="true"></i>
              <i data-lucide="sun" class="h-3.5 w-3.5 dark:hidden block" aria-hidden="true"></i>
            </span>
          </button>
        </div>
      </div>

      <!-- Search -->
      <div class="relative">
        <i data-lucide="search" class="pointer-events-none absolute left-3.5 top-1/2 h-4 w-4 -translate-y-1/2 text-faint" aria-hidden="true"></i>
        <input
          id="search-input"
          type="text"
          placeholder="Search tools by name or purpose…"
          autocomplete="off"
          class="w-full rounded-md border border-line bg-panel py-2.5 pl-10 pr-20 text-sm text-ink placeholder:text-faint outline-none transition focus:border-accent"
        />
        <button
          id="clear-search"
          type="button"
          class="absolute right-16 top-1/2 hidden -translate-y-1/2 rounded p-1 text-faint hover:text-ink"
          aria-label="Clear search"
        >
          <i data-lucide="x" class="h-4 w-4" aria-hidden="true"></i>
        </button>
        <kbd class="absolute right-3 top-1/2 -translate-y-1/2 rounded border border-line px-1.5 py-0.5 font-mono text-[10px] text-faint">
          ⌘K
        </kbd>
      </div>

      <!-- Category Navigation Strip with Left & Right Arrow Buttons -->
      <div class="relative flex items-center gap-1.5">
        <button
          id="cat-scroll-left"
          type="button"
          class="flex h-8 w-8 shrink-0 items-center justify-center rounded-md border border-line bg-panel text-faint transition hover:border-accent hover:text-ink disabled:opacity-30 disabled:pointer-events-none"
          aria-label="Scroll categories left"
        >
          <i data-lucide="chevron-left" class="h-4 w-4" aria-hidden="true"></i>
        </button>

        <div id="category-tabs" class="flex flex-nowrap items-center gap-2 overflow-x-auto scroll-smooth scrollbar-none py-1" role="tablist" aria-label="Filter tools by category"></div>

        <button
          id="cat-scroll-right"
          type="button"
          class="flex h-8 w-8 shrink-0 items-center justify-center rounded-md border border-line bg-panel text-faint transition hover:border-accent hover:text-ink disabled:opacity-30 disabled:pointer-events-none"
          aria-label="Scroll categories right"
        >
          <i data-lucide="chevron-right" class="h-4 w-4" aria-hidden="true"></i>
        </button>
      </div>
    </div>
  </header>

  <!-- MAIN -->
  <main id="browse" class="mx-auto max-w-7xl px-4 py-8 sm:px-6 lg:px-8">
    <!-- Favorites -->
    <section id="favorites-section" class="mb-10 hidden">
      <div class="mb-3 flex items-center gap-2">
        <i data-lucide="star" class="h-4 w-4 text-signal" aria-hidden="true"></i>
        <h2 class="font-mono text-xs uppercase tracking-widest text-faint">Favorites</h2>
      </div>
      <div id="favorites-grid" class="grid grid-cols-1 gap-6 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4"></div>
    </section>

    <!-- All tools -->
    <section>
      <div class="mb-4 flex items-center justify-between">
        <h2 class="font-mono text-xs uppercase tracking-widest text-faint">All Tools</h2>
        <span id="results-count" class="font-mono text-xs text-faint"></span>
      </div>

      <div id="tool-grid" class="grid grid-cols-1 gap-6 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4"></div>

      <!-- Empty state -->
      <div id="empty-state" class="hidden flex-col items-center justify-center rounded-card border border-dashed border-line py-16 text-center">
        <div class="mb-4 flex h-12 w-12 items-center justify-center rounded-full border border-line-strong text-faint">
          <i data-lucide="search-x" class="h-6 w-6" aria-hidden="true"></i>
        </div>
        <p class="font-display text-base font-semibold text-ink">Nothing on this sheet</p>
        <p class="mt-1 max-w-xs text-sm text-muted">
          No tools match your current search or category.
        </p>
        <button
          id="clear-filters-btn"
          type="button"
          class="mt-4 rounded-md border border-line-strong px-4 py-2 font-mono text-xs uppercase tracking-wide text-ink transition hover:border-accent hover:text-accent"
        >
          Clear filters
        </button>
      </div>
    </section>
  </main>

  <!-- FOOTER -->
  <footer class="border-t border-line bg-panel">
    <div class="mx-auto max-w-7xl px-4 py-8 sm:px-6 lg:px-8">
      <div class="mb-6">
        <h2 class="mb-3 font-mono text-xs uppercase tracking-widest text-faint">Browse by category</h2>
        <div id="footer-categories" class="flex flex-wrap gap-x-5 gap-y-2"></div>
      </div>

      <div class="grid grid-cols-2 gap-4 border-t border-line pt-5 font-mono text-[11px] uppercase tracking-wide text-faint sm:grid-cols-4">
        <div>
          <div class="text-faint/70">Tools</div>
          <div class="text-muted" id="footer-tool-count">00</div>
        </div>
        <div>
          <div class="text-faint/70">Rev</div>
          <div class="text-muted" id="footer-rev-date">—</div>
        </div>
        <div>
          <div class="text-faint/70">Drawn by</div>
          <div class="text-muted">ProBro</div>
        </div>
        <div>
          <div class="text-faint/70">© <span id="footer-year"></span></div>
          <div class="text-muted">Utility Hub</div>
        </div>
      </div>
    </div>
  </footer>

  <!-- PREVIEW MODAL -->
  <div id="preview-modal" class="fixed inset-0 z-50 hidden">
    <div class="modal-backdrop absolute inset-0 bg-black/60" data-backdrop></div>
    <div class="relative flex h-full items-center justify-center p-4">
      <div
        class="modal-panel flex h-[85vh] w-full max-w-4xl flex-col overflow-hidden rounded-card border border-line bg-elevated shadow-2xl"
        role="dialog"
        aria-modal="true"
        aria-labelledby="preview-title"
      >
        <div class="flex items-center justify-between border-b border-line px-5 py-3">
          <h3 id="preview-title" class="font-display text-sm font-semibold text-ink" tabindex="-1" data-autofocus>Preview</h3>
          <div class="flex items-center gap-2">
            <a
              id="preview-open-full"
              href="#"
              target="_blank"
              rel="noopener"
              class="flex items-center gap-1.5 rounded-md border border-line px-2.5 py-1.5 font-mono text-[11px] uppercase tracking-wide text-muted transition hover:border-accent hover:text-accent"
            >
              <i data-lucide="external-link" class="h-3.5 w-3.5" aria-hidden="true"></i>
              Open full
            </a>
            <button id="preview-close" type="button" class="rounded-md p-1.5 text-muted transition hover:text-ink" aria-label="Close preview">
              <i data-lucide="x" class="h-4 w-4" aria-hidden="true"></i>
            </button>
          </div>
        </div>
        <iframe id="preview-iframe" title="Tool preview" class="h-full w-full flex-1 bg-white" src="about:blank"></iframe>
      </div>
    </div>
  </div>

  <div
    id="toast-region"
    role="status"
    aria-live="polite"
    class="fixed bottom-5 left-1/2 z-[60] -translate-x-1/2 translate-y-2 rounded-md border border-line-strong bg-elevated px-4 py-2 font-mono text-xs text-ink opacity-0 shadow-lg transition-all"
  ></div>

  <!-- Category Arrow Navigation Script -->
  <script>
    (function () {
      var tabs = document.getElementById('category-tabs');
      var btnLeft = document.getElementById('cat-scroll-left');
      var btnRight = document.getElementById('cat-scroll-right');

      function updateArrowStates() {
        if (!tabs || !btnLeft || !btnRight) return;
        btnLeft.disabled = tabs.scrollLeft <= 2;
        btnRight.disabled = Math.ceil(tabs.scrollLeft + tabs.clientWidth) >= tabs.scrollWidth - 2;
      }

      if (tabs && btnLeft && btnRight) {
        btnLeft.addEventListener('click', function () {
          tabs.scrollBy({ left: -220, behavior: 'smooth' });
        });
        btnRight.addEventListener('click', function () {
          tabs.scrollBy({ left: 220, behavior: 'smooth' });
        });
        tabs.addEventListener('scroll', updateArrowStates);
        window.addEventListener('resize', updateArrowStates);
        setTimeout(updateArrowStates, 300);
      }
    })();
  </script>

  <script src="app.js"></script>
  <script src="style.js" data-uh-page-type="dashboard"></script>
  <script src="pwa.js"></script>
</body>
</html>

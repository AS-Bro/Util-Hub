<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#091521">
  <title>Offline - Utility Hub</title>
  <script src="style.js" data-uh-page-type="tool" data-uh-title="Offline"></script>
</head>
<body>
  <main class="uh-container uh-container--narrow">
    <div class="uh-page-heading">
      <h1>You're offline</h1>
      <p>Utility Hub needs a connection the first time you open a tool. Pages you have already visited may still be available.</p>
    </div>
    <section class="uh-card" aria-labelledby="offline-tools-title">
      <h2 class="uh-card-title" id="offline-tools-title">Tools cached on this device</h2>
      <ul id="offline-tools" class="uh-stack" aria-live="polite">
        <li>Checking for cached tools…</li>
      </ul>
      <p><a class="uh-button-secondary" href="./index.html">Return to Utility Hub</a></p>
    </section>
  </main>
  <script>
    (function () {
      var list = document.getElementById('offline-tools');
      function showPages(pages) {
        list.textContent = '';
        if (!pages.length) {
          var empty = document.createElement('li');
          empty.textContent = 'No previously opened tools are cached yet.';
          list.appendChild(empty);
          return;
        }
        pages.forEach(function (page) {
          var item = document.createElement('li');
          var link = document.createElement('a');
          link.href = page.href;
          link.textContent = page.name.replace(/\b\w/g, function (letter) { return letter.toUpperCase(); });
          item.appendChild(link);
          list.appendChild(item);
        });
      }

      if (!('serviceWorker' in navigator) || !('MessageChannel' in window)) {
        showPages([]);
        return;
      }
      navigator.serviceWorker.ready.then(function (registration) {
        var worker = navigator.serviceWorker.controller || registration.active;
        if (!worker) {
          showPages([]);
          return;
        }
        var channel = new MessageChannel();
        var timeout = window.setTimeout(function () { showPages([]); }, 1500);
        channel.port1.onmessage = function (event) {
          window.clearTimeout(timeout);
          showPages(event.data && Array.isArray(event.data.pages) ? event.data.pages : []);
          channel.port1.close();
        };
        worker.postMessage({ type: 'UTILITY_HUB_GET_CACHED_PAGES' }, [channel.port2]);
      }).catch(function () {
        showPages([]);
      });
    })();
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Rotate PDF — PDF Toolkit</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../css/style.css" />
</head>
<body>
  <div class="wrap">
    <a href="../index.html" class="back-link">&larr; Back to PDF Toolkit</a>
    <h1 class="page-title display">Rotate PDF</h1>
    <p class="page-sub">Rotate every page, only selected pages, or one page at a time — 90°, 180° or 270°.</p>

    <div id="dropZone" class="drop-zone">
      <input type="file" id="fileInput" accept="application/pdf" class="hidden" />
      <div class="icon">🔄</div>
      <div class="primary-txt">Click or drag a PDF file here</div>
      <div class="sub-txt">Processed entirely in your browser</div>
    </div>

    <div id="workspace" class="hidden" style="margin-top:20px;">
      <div class="grid">
        <div class="col-7">
          <div class="card">
            <span class="card-title">Pages (<span id="pageCountLabel">0</span>) — click to select</span>
            <div id="thumbGrid" class="thumb-grid"></div>
          </div>
        </div>
        <div class="col-5">
          <div class="card">
            <span class="card-title">Rotate</span>
            <div class="btn-row" style="margin-bottom:10px;">
              <button class="secondary" id="selectAllBtn" style="flex:1;">Select All</button>
              <button class="secondary" id="selectNoneBtn" style="flex:1;">Clear</button>
            </div>
            <span class="section-label">Selected Pages (<span id="selCount">0</span>)</span>
            <div class="btn-row">
              <button class="secondary" id="rotSelLeft" style="flex:1;">⟲ Rotate Left</button>
              <button class="secondary" id="rotSelRight" style="flex:1;">⟳ Rotate Right</button>
            </div>
            <div class="divider"></div>
            <span class="section-label">All Pages</span>
            <div class="btn-row">
              <button class="secondary" id="rotAllLeft" style="flex:1;">⟲ Rotate All Left</button>
              <button class="secondary" id="rotAllRight" style="flex:1;">⟳ Rotate All Right</button>
            </div>
            <button class="secondary btn-full" id="rotAll180" style="margin-top:8px;">↻ Rotate All 180°</button>
            <button class="secondary btn-full" id="resetRotBtn" style="margin-top:8px;">Reset All Rotations</button>

            <div class="field" style="margin-top:14px;">
              <label class="field-label">Output File Name</label>
              <input type="text" id="outputName" placeholder="rotated" />
            </div>
            <div class="divider"></div>
            <button class="primary btn-full" id="applyBtn">🔄 Apply &amp; Save PDF</button>
          </div>

          <div id="statusHud" class="status-hud hidden" style="margin-top:14px;">
            <div class="status-text" id="statusText">Rotating...</div>
            <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
          </div>

          <div id="resultBox" class="result-box hidden" style="margin-top:14px;">
            <div class="result-row"><span>Pages rotated</span><strong id="rCount">—</strong></div>
            <div class="result-row"><span>File size</span><strong id="rSize">—</strong></div>
            <button class="primary btn-full" id="downloadBtn" style="margin-top:10px;">💾 Download PDF</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="../js/vendor/pdf-lib.min.js"></script>
  <script src="../js/vendor/pdf.min.js"></script>
  <script src="../js/vendor/jszip.min.js"></script>
  <script src="../js/common.js"></script>
  <script src="../js/pdf-utils.js"></script>
  <script>
    const dropZone = document.getElementById('dropZone');
    const fileInput = document.getElementById('fileInput');
    const workspace = document.getElementById('workspace');
    const thumbGrid = document.getElementById('thumbGrid');
    const hud = Toolkit.StatusHud(document.getElementById('statusHud'), document.getElementById('statusText'), document.getElementById('progressFill'));

    let pdfjsDoc = null, srcBuffer = null, srcName = '', pageCount = 0;
    let pageState = []; // { idx, rotation, selected, canvas, cardEl }
    let outputBlob = null;

    Toolkit.setupDropzone({ dropZone, input: fileInput, onFiles: (f) => loadFile(f[0]) });

    async function loadFile(file) {
      if (!file) return;
      srcName = file.name;
      srcBuffer = await Toolkit.readAsArrayBuffer(file);
      pdfjsDoc = await PDFUtils.loadPdfJs(srcBuffer);
      pageCount = pdfjsDoc.numPages;
      document.getElementById('pageCountLabel').textContent = pageCount;
      document.getElementById('outputName').value = Toolkit.baseName(srcName) + '_rotated';
      pageState = [];
      for (let i = 1; i <= pageCount; i++) pageState.push({ idx: i, rotation: 0, selected: false });
      workspace.classList.remove('hidden');
      dropZone.style.padding = '20px';
      await renderThumbs();
    }

    async function renderThumbs() {
      thumbGrid.innerHTML = '';
      for (const ps of pageState) {
        const card = document.createElement('div');
        card.className = 'thumb-card';
        card.innerHTML = `<div class="select-dot"></div><div class="page-num">Page ${ps.idx}</div>`;
        thumbGrid.appendChild(card);
        ps.cardEl = card;
        card.addEventListener('click', () => {
          ps.selected = !ps.selected;
          card.classList.toggle('selected', ps.selected);
          updateSelCount();
        });
        PDFUtils.renderThumbnail(pdfjsDoc, ps.idx, 150).then(canvas => {
          canvas.style.transition = 'transform .15s ease';
          card.insertBefore(canvas, card.firstChild);
          ps.canvas = canvas;
          applyVisualRotation(ps);
        });
      }
    }

    function applyVisualRotation(ps) {
      if (!ps.canvas) return;
      ps.canvas.style.transform = `rotate(${ps.rotation}deg)`;
      let badge = ps.cardEl.querySelector('.rot-indicator');
      if (ps.rotation !== 0) {
        if (!badge) { badge = document.createElement('span'); badge.className = 'rot-indicator'; ps.cardEl.appendChild(badge); }
        badge.textContent = ps.rotation + '°';
      } else if (badge) badge.remove();
    }

    function updateSelCount() {
      document.getElementById('selCount').textContent = pageState.filter(p => p.selected).length;
    }

    function rotateSet(pages, delta) {
      pages.forEach(ps => { ps.rotation = ((ps.rotation + delta) % 360 + 360) % 360; applyVisualRotation(ps); });
    }

    document.getElementById('selectAllBtn').addEventListener('click', () => {
      pageState.forEach(p => { p.selected = true; p.cardEl.classList.add('selected'); });
      updateSelCount();
    });
    document.getElementById('selectNoneBtn').addEventListener('click', () => {
      pageState.forEach(p => { p.selected = false; p.cardEl.classList.remove('selected'); });
      updateSelCount();
    });
    document.getElementById('rotSelLeft').addEventListener('click', () => rotateSet(pageState.filter(p => p.selected), -90));
    document.getElementById('rotSelRight').addEventListener('click', () => rotateSet(pageState.filter(p => p.selected), 90));
    document.getElementById('rotAllLeft').addEventListener('click', () => rotateSet(pageState, -90));
    document.getElementById('rotAllRight').addEventListener('click', () => rotateSet(pageState, 90));
    document.getElementById('rotAll180').addEventListener('click', () => rotateSet(pageState, 180));
    document.getElementById('resetRotBtn').addEventListener('click', () => { pageState.forEach(p => { p.rotation = 0; applyVisualRotation(p); }); });

    document.getElementById('applyBtn').addEventListener('click', async () => {
      hud.show('Applying rotations...');
      try {
        const outDoc = await PDFUtils.loadPdfLib(srcBuffer);
        const pages = outDoc.getPages();
        let rotatedCount = 0;
        pageState.forEach((ps, i) => {
          if (ps.rotation) {
            const page = pages[i];
            const current = page.getRotation().angle || 0;
            page.setRotation(PDFLib.degrees((current + ps.rotation) % 360));
            rotatedCount++;
          }
        });
        hud.set('Saving PDF...', 70);
        const bytes = await outDoc.save();
        outputBlob = PDFUtils.bytesToBlob(bytes);
        document.getElementById('rCount').textContent = rotatedCount;
        document.getElementById('rSize').textContent = Toolkit.formatBytes(outputBlob.size);
        document.getElementById('resultBox').classList.remove('hidden');
        hud.done('Rotation applied!');
      } catch (e) {
        hud.error('Failed: ' + e.message);
        console.error(e);
      }
    });

    document.getElementById('downloadBtn').addEventListener('click', () => {
      if (!outputBlob) return;
      const name = document.getElementById('outputName').value.trim() || 'rotated';
      Toolkit.downloadBlob(outputBlob, Toolkit.sanitizeFilename(name) + '.pdf');
    });
  </script>
</body>
</html>

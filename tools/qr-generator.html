<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>QR Code Generator — Utility Hub</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Inter:wght@400;500&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  input[type="color"] {
    -webkit-appearance: none;
    border: none;
    cursor: pointer;
  }
  input[type="color"]::-webkit-color-swatch-wrapper { padding: 0; }
  input[type="color"]::-webkit-color-swatch { border: 1px solid var(--uh-line); border-radius: var(--uh-radius-sm); }
  
  /* Custom styled slider track */
  input[type="range"] {
    accent-color: var(--uh-accent);
  }
</style>
  <script src="../style.js" data-uh-page-type="tool" data-uh-title="QR Code Generator"></script>
</head>
<body>
  <main class="uh-container uh-container--narrow">
    <div class="uh-page-head">
      <h1 class="uh-page-title">QR Code Generator</h1>
      <p class="uh-page-sub">Turn links, text, or Wi-Fi credentials into customizable, high-res QR codes.</p>
    </div>

    <!-- Quick Type Selection -->
    <div class="flex flex-wrap gap-2 mb-4">
      <button type="button" onclick="setPreset('url')" class="uh-btn uh-btn--secondary mono text-[11px] uppercase px-3 py-1.5 rounded-md">URL</button>
      <button type="button" onclick="setPreset('wifi')" class="uh-btn uh-btn--secondary mono text-[11px] uppercase px-3 py-1.5 rounded-md">Wi-Fi</button>
      <button type="button" onclick="setPreset('email')" class="uh-btn uh-btn--secondary mono text-[11px] uppercase px-3 py-1.5 rounded-md">Email</button>
      <button type="button" onclick="setPreset('text')" class="uh-btn uh-btn--secondary mono text-[11px] uppercase px-3 py-1.5 rounded-md">Text</button>
    </div>

    <!-- Data Input -->
    <div class="mb-6">
      <textarea id="input" rows="3" placeholder="Enter a link or text…" class="uh-textarea w-full rounded-md p-3 text-sm resize-none">https://example.com</textarea>
    </div>

    <!-- Customization Options Grid -->
    <div class="uh-card mb-6 grid grid-cols-2 gap-4 sm:grid-cols-4 p-4">
      <div>
        <label class="uh-label mono text-[11px] uppercase tracking-wide block mb-1.5">Size</label>
        <select id="size" class="uh-select w-full rounded-md p-2 text-xs">
          <option value="200">200 x 200 px</option>
          <option value="300" selected>300 x 300 px</option>
          <option value="400">400 x 400 px</option>
          <option value="500">500 x 500 px</option>
        </select>
      </div>

      <div>
        <label class="uh-label mono text-[11px] uppercase tracking-wide block mb-1.5">Format</label>
        <select id="format" class="uh-select w-full rounded-md p-2 text-xs">
          <option value="png" selected>PNG</option>
          <option value="svg">SVG</option>
          <option value="jpg">JPG</option>
        </select>
      </div>

      <div>
        <label class="uh-label mono text-[11px] uppercase tracking-wide block mb-1.5">Foreground</label>
        <div class="uh-panel flex items-center gap-2 p-1.5 rounded-md">
          <input id="fgColor" type="color" value="#000000" class="h-6 w-6 rounded bg-transparent" />
          <span id="fgHex" class="mono text-xs">#000000</span>
        </div>
      </div>

      <div>
        <label class="uh-label mono text-[11px] uppercase tracking-wide block mb-1.5">Background</label>
        <div class="uh-panel flex items-center gap-2 p-1.5 rounded-md">
          <input id="bgColor" type="color" value="#ffffff" class="h-6 w-6 rounded bg-transparent" />
          <span id="bgHex" class="mono text-xs">#FFFFFF</span>
        </div>
      </div>

      <!-- Expanded Background Margin / Border Size Slider (0 to 20 modules) -->
      <div class="col-span-2 sm:col-span-4 border-t border-[var(--uh-line)] pt-3 mt-1">
        <div class="flex justify-between items-center mb-1.5">
          <label class="uh-label mono text-[11px] uppercase tracking-wide">
            Background Margin Size <span class="text-[var(--uh-faint)] text-[10px] lowercase">(larger = smaller QR)</span>
          </label>
          <span id="marginVal" class="mono text-xs text-[var(--uh-accent)]">10 px</span>
        </div>
        <input id="margin" type="range" min="10" max="50" value="10" step="1" class="uh-range w-full cursor-pointer" />
      </div>
    </div>

    <!-- Preview & Action Panel -->
    <div class="uh-card flex flex-col items-center gap-4 p-6">
      <div class="uh-panel relative flex items-center justify-center p-3 min-h-[220px]">
        <img id="qr" alt="Generated QR code" class="rounded-md transition-opacity duration-200" width="200" height="200" />
      </div>

      <div class="flex flex-wrap items-center justify-center gap-3">
        <button id="downloadBtn" type="button" class="uh-btn uh-btn--primary mono text-xs uppercase px-5 py-2.5 rounded-md transition flex items-center gap-2">
          Download File
        </button>
        <button id="copyBtn" type="button" class="uh-btn uh-btn--secondary mono text-xs uppercase px-4 py-2.5 rounded-md transition">
          Copy Image
        </button>
      </div>
      <div id="qrError" class="uh-alert uh-alert--error hidden w-full" role="alert"></div>
    </div>
  </main>

  <script src="vendor/qrcode-generator-1.4.4.js"></script>
  <script>
    const input = document.getElementById('input');
    const size = document.getElementById('size');
    const format = document.getElementById('format');
    const fgColor = document.getElementById('fgColor');
    const bgColor = document.getElementById('bgColor');
    const fgHex = document.getElementById('fgHex');
    const bgHex = document.getElementById('bgHex');
    const margin = document.getElementById('margin');
    const marginVal = document.getElementById('marginVal');
    const qr = document.getElementById('qr');
    const qrError = document.getElementById('qrError');
    const downloadBtn = document.getElementById('downloadBtn');
    const copyBtn = document.getElementById('copyBtn');

    let currentQrUrl = '';
    let currentQrCode = null;

    function buildQrCode() {
      qrcode.stringToBytes = function (text) {
        return Array.from(new TextEncoder().encode(text));
      };
      const code = qrcode(0, 'M');
      code.addData(input.value.trim() || 'https://example.com', 'Byte');
      code.make();
      return code;
    }

    function createSvg(code, outputSize, marginSize) {
      const count = code.getModuleCount();
      const codeSize = outputSize - marginSize * 2;
      let path = '';

      for (let row = 0; row < count; row += 1) {
        for (let col = 0; col < count; col += 1) {
          if (code.isDark(row, col)) {
            const x = marginSize + col * codeSize / count;
            const y = marginSize + row * codeSize / count;
            const right = marginSize + (col + 1) * codeSize / count;
            const bottom = marginSize + (row + 1) * codeSize / count;
            path += `M${x} ${y}H${right}V${bottom}H${x}Z`;
          }
        }
      }

      return `<svg xmlns="http://www.w3.org/2000/svg" width="${outputSize}" height="${outputSize}" viewBox="0 0 ${outputSize} ${outputSize}" shape-rendering="crispEdges"><rect width="100%" height="100%" fill="${bgColor.value}"/><path fill="${fgColor.value}" d="${path}"/></svg>`;
    }

    function drawCanvas(code, outputSize, marginSize) {
      const canvas = document.createElement('canvas');
      const context = canvas.getContext('2d');
      const count = code.getModuleCount();
      const codeSize = outputSize - marginSize * 2;
      canvas.width = outputSize;
      canvas.height = outputSize;
      context.fillStyle = bgColor.value;
      context.fillRect(0, 0, outputSize, outputSize);
      context.fillStyle = fgColor.value;

      for (let row = 0; row < count; row += 1) {
        for (let col = 0; col < count; col += 1) {
          if (code.isDark(row, col)) {
            const left = Math.round(marginSize + col * codeSize / count);
            const top = Math.round(marginSize + row * codeSize / count);
            const right = Math.round(marginSize + (col + 1) * codeSize / count);
            const bottom = Math.round(marginSize + (row + 1) * codeSize / count);
            context.fillRect(left, top, right - left, bottom - top);
          }
        }
      }
      return canvas;
    }

    function update() {
      fgHex.textContent = fgColor.value.toUpperCase();
      bgHex.textContent = bgColor.value.toUpperCase();
      marginVal.textContent = `${margin.value} px`;

      try {
        currentQrCode = buildQrCode();
        const outputSize = Number(size.value);
        const marginSize = Number(margin.value);
        const codeSize = outputSize - marginSize * 2;
        if (codeSize <= 0 ||
          (format.value !== 'svg' && currentQrCode.getModuleCount() > codeSize)) {
          throw new Error('The selected output size and margin are too small for this text.');
        }

        if (format.value === 'svg') {
          const svg = createSvg(currentQrCode, outputSize, marginSize);
          currentQrUrl = `data:image/svg+xml;charset=utf-8,${encodeURIComponent(svg)}`;
        } else {
          const canvas = drawCanvas(currentQrCode, outputSize, marginSize);
          currentQrUrl = canvas.toDataURL(format.value === 'jpg' ? 'image/jpeg' : 'image/png', 0.92);
        }
        qr.src = currentQrUrl;
        qrError.classList.add('hidden');
        qrError.textContent = '';
        downloadBtn.disabled = false;
        copyBtn.disabled = false;
      } catch (error) {
        currentQrUrl = '';
        qr.removeAttribute('src');
        qrError.textContent = error && error.message === 'The selected output size and margin are too small for this text.'
          ? error.message + ' Increase the size, reduce the margin, or shorten the text.'
          : 'This text is too long to encode as a QR code. Shorten it and try again.';
        qrError.classList.remove('hidden');
        downloadBtn.disabled = true;
        copyBtn.disabled = true;
      }
    }

    async function downloadQR() {
      try {
        downloadBtn.innerText = 'Downloading...';
        const a = document.createElement('a');
        a.href = currentQrUrl;
        a.download = `qr-code.${format.value}`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
      } finally {
        downloadBtn.innerText = `Download ${format.value.toUpperCase()}`;
      }
    }

    // Copy QR Image to Clipboard
    async function copyQR() {
      try {
        const count = currentQrCode.getModuleCount();
        const outputSize = Math.max(Number(size.value), count + Number(margin.value) * 2);
        const canvas = drawCanvas(currentQrCode, outputSize, Number(margin.value));
        const blob = await new Promise((resolve, reject) => {
          canvas.toBlob((imageBlob) => {
            if (imageBlob) resolve(imageBlob);
            else reject(new Error('Could not render the QR image.'));
          }, 'image/png');
        });
        await navigator.clipboard.write([
          new ClipboardItem({ [blob.type]: blob })
        ]);
        copyBtn.innerText = 'Copied!';
        setTimeout(() => copyBtn.innerText = 'Copy Image', 2000);
      } catch (error) {
        alert('Copying image failed or is not supported by your browser.');
      }
    }

    // Input presets helper
    function setPreset(type) {
      if (type === 'wifi') {
        input.value = 'WIFI:S:MyNetwork;T:WPA;P:Password123;;';
      } else if (type === 'url') {
        input.value = 'https://example.com';
      } else if (type === 'email') {
        input.value = 'mailto:hello@example.com?subject=Hello';
      } else if (type === 'text') {
        input.value = 'Utility Hub QR Code Generator';
      }
      update();
    }

    // Listeners
    input.addEventListener('input', update);
    size.addEventListener('change', update);
    format.addEventListener('change', () => {
      downloadBtn.innerText = `Download ${format.value.toUpperCase()}`;
      update();
    });
    fgColor.addEventListener('input', update);
    bgColor.addEventListener('input', update);
    margin.addEventListener('input', update);

    downloadBtn.addEventListener('click', downloadQR);
    copyBtn.addEventListener('click', copyQR);

    // Initial setup
    update();
    downloadBtn.innerText = `Download ${format.value.toUpperCase()}`;
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Text Imposition Studio Pro</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />

<style>
  body { background:#0e1c2b; color:#e7eef4; font-family:'Inter',sans-serif; }
  .mono { font-family:'IBM Plex Mono',monospace; }
  .display { font-family:'Space Grotesk',sans-serif; }
  
  select, input[type="text"], input[type="number"], textarea { 
    background:#14283b; 
    border:1px solid rgba(143,176,204,.16); 
    color:#e7eef4; 
  }
  select:focus, input:focus, textarea:focus { outline:none; border-color:#6fd8cb; }
  
  /* Buttons */
  button.primary { background:#6fd8cb; color:#0e1c2b; font-weight:700; }
  button.primary:hover:not(:disabled) { background:#93e5da; box-shadow: 0 0 15px rgba(111,216,203,0.3); }
  button.secondary { background:#17304a; border:1px solid rgba(143,176,204,.2); color:#e7eef4; }
  button.secondary:hover:not(:disabled) { border-color:#6fd8cb; color:#6fd8cb; }
  
  .copy-btn { background:#0ea5e9; color:#ffffff; font-weight:600; transition: all 0.2s; }
  .copy-btn:hover { background:#0284c7; }
  .copy-btn.copied { background:#10b981 !important; color:#0e1c2b; }

  /* Custom styled scrollbars */
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: #0e1c2b; }
  ::-webkit-scrollbar-thumb { background: #17304a; border-radius: 3px; }
  ::-webkit-scrollbar-thumb:hover { background: #6fd8cb; }
</style>
</head>
<body class="min-h-screen py-10 px-4">
  <div class="mx-auto max-w-3xl">
    
    <!-- Header -->
    <div class="border-b border-white/10 pb-4 mb-6">
      <a href="../index.html" class="mono text-xs uppercase tracking-wide text-teal-300 hover:underline">&larr; Back to Utility Hub</a>
      <h1 class="display text-2xl font-bold mt-2">Text Imposition Studio Pro</h1>
      <p class="text-xs text-slate-400 mt-1">Batch repeat, format, sequence, clean, and transform text lines with instant offline processing.</p>
    </div>

    <!-- Main Studio Workspace Card -->
    <div class="bg-[#14283b]/30 p-6 rounded-lg border border-white/10 space-y-5">
      
      <!-- Input Mode Switcher -->
      <div class="grid grid-cols-3 gap-2 bg-[#0e1c2b] p-1.5 rounded-md border border-white/5 mono text-xs">
        <button onclick="setMode('single')" id="modeBtnSingle" class="py-1.5 rounded text-center font-semibold bg-[#17304a] text-teal-300">Single Line</button>
        <button onclick="setMode('multi')" id="modeBtnMulti" class="py-1.5 rounded text-center text-slate-400 hover:text-white">Multi-Line List</button>
        <button onclick="setMode('sequence')" id="modeBtnSequence" class="py-1.5 rounded text-center text-slate-400 hover:text-white">Sequence Generator</button>
      </div>

      <!-- Source Text Input -->
      <div>
        <div class="flex justify-between items-center mb-1">
          <label id="inputLabel" class="mono text-xs text-slate-300 font-semibold">Enter your line of text:</label>
          <span id="sequenceHint" class="hidden mono text-[10px] text-teal-300">Use {i} for auto-increment index</span>
        </div>
        <textarea id="sourceText" rows="3" class="w-full rounded-md p-3 text-sm mono" placeholder="Type text here..." oninput="updateInputStats()"></textarea>
        <div class="flex justify-between items-center mt-1.5 mono text-[11px] text-slate-400">
          <span id="charCount">0 characters</span>
          <span id="wordCount">0 words</span>
        </div>
      </div>

      <!-- Core Configuration Grid -->
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <div>
          <label id="countLabel" class="mono text-xs text-slate-300 block mb-1 font-semibold">Repeat Count (Max 10000):</label>
          <input type="number" id="repeatCount" min="1" max="10000" value="10" class="w-full rounded-md p-2 text-xs mono" />
        </div>
        <div>
          <label class="mono text-xs text-slate-300 block mb-1 font-semibold">Line Separator:</label>
          <select id="separatorType" class="w-full rounded-md p-2 text-xs">
            <option value="newline">New Line (\n)</option>
            <option value="comma">Comma (, )</option>
            <option value="semicolon">Semicolon (; )</option>
            <option value="space">Space ( )</option>
            <option value="custom">Custom Separator</option>
          </select>
        </div>
      </div>

      <!-- Custom Separator Sub-input -->
      <div id="customSeparatorContainer" class="hidden">
        <label class="mono text-[11px] text-slate-400 block mb-1">Custom Separator Symbol</label>
        <input type="text" id="customSeparator" placeholder="e.g. | or --" class="w-full rounded-md p-2 text-xs mono" />
      </div>

      <!-- Module 1: Prefixing -->
      <div class="pt-2 border-t border-white/5">
        <label class="flex items-center gap-2 text-xs text-slate-200 cursor-pointer font-medium select-none">
          <input type="checkbox" id="enablePrefix" onchange="togglePrefixOptions()" class="accent-teal-400 w-4 h-4 rounded" />
          <span>Add Line Prefix (Numbers / Bullets)</span>
        </label>

        <div id="prefixOptionsPanel" class="hidden mt-3 bg-[#0e1c2b]/60 p-3 rounded-md border border-white/5 space-y-3">
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">
            <div>
              <label class="mono text-[11px] text-slate-400 block mb-1">Prefix Style</label>
              <select id="prefixType" onchange="toggleCustomSymbolInput()" class="w-full rounded-md p-2 text-xs">
                <option value="numbers">Standard Numbers (1, 2, 3...)</option>
                <option value="padded">Padded Numbers (001, 002...)</option>
                <option value="roman">Roman Numerals (I, II, III...)</option>
                <option value="alpha">Alphabetical (A, B, C...)</option>
                <option value="custom">Custom Symbol / Bullet</option>
              </select>
            </div>
            <div id="customSymbolContainer" class="hidden">
              <label class="mono text-[11px] text-slate-400 block mb-1">Custom Bullet / Symbol</label>
              <input type="text" id="customSymbol" value="• " placeholder="e.g., • or -" class="w-full rounded-md p-2 text-xs mono" />
            </div>
          </div>
        </div>
      </div>

      <!-- Module 2: Suffixing -->
      <div class="pt-2 border-t border-white/5">
        <label class="flex items-center gap-2 text-xs text-slate-200 cursor-pointer font-medium select-none">
          <input type="checkbox" id="enableSuffix" onchange="toggleSuffixOptions()" class="accent-teal-400 w-4 h-4 rounded" />
          <span>Add Line Suffix (End Tags / Symbols)</span>
        </label>

        <div id="suffixOptionsPanel" class="hidden mt-3 bg-[#0e1c2b]/60 p-3 rounded-md border border-white/5">
          <label class="mono text-[11px] text-slate-400 block mb-1">Suffix Text</label>
          <input type="text" id="customSuffix" placeholder="e.g., ; or [END]" class="w-full rounded-md p-2 text-xs mono" />
        </div>
      </div>

      <!-- Module 3: Text Transformations & Filters -->
      <div class="pt-2 border-t border-white/5">
        <label class="flex items-center gap-2 text-xs text-slate-200 cursor-pointer font-medium select-none">
          <input type="checkbox" id="enableTransform" onchange="toggleTransformOptions()" class="accent-teal-400 w-4 h-4 rounded" />
          <span>Text Transformation, Replace & Cleaning</span>
        </label>

        <div id="transformPanel" class="hidden mt-3 bg-[#0e1c2b]/60 p-3 rounded-md border border-white/5 space-y-3">
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">
            <div>
              <label class="mono text-[11px] text-slate-400 block mb-1">Text Casing</label>
              <select id="textCase" class="w-full rounded-md p-2 text-xs">
                <option value="none font-semibold">Original Case</option>
                <option value="uppercase">UPPERCASE</option>
                <option value="lowercase">lowercase</option>
                <option value="capitalize">Capitalize Words</option>
              </select>
            </div>
            <div>
              <label class="mono text-[11px] text-slate-400 block mb-1">Sorting & Reversing</label>
              <select id="sortOrder" class="w-full rounded-md p-2 text-xs">
                <option value="none">Default Order</option>
                <option value="reverse">Reverse Order</option>
                <option value="shuffle">Randomize / Shuffle</option>
              </select>
            </div>
          </div>

          <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">
            <div>
              <label class="mono text-[11px] text-slate-400 block mb-1">Find String</label>
              <input type="text" id="findText" placeholder="Search text..." class="w-full rounded-md p-2 text-xs mono" />
            </div>
            <div>
              <label class="mono text-[11px] text-slate-400 block mb-1">Replace With</label>
              <input type="text" id="replaceText" placeholder="Replacement..." class="w-full rounded-md p-2 text-xs mono" />
            </div>
          </div>

          <!-- Cleaner Toggles -->
          <div class="grid grid-cols-2 gap-2 pt-1">
            <label class="flex items-center gap-2 text-xs text-slate-300 cursor-pointer">
              <input type="checkbox" id="trimWhitespace" class="accent-teal-400 w-3.5 h-3.5 rounded" />
              <span>Trim Space</span>
            </label>
            <label class="flex items-center gap-2 text-xs text-slate-300 cursor-pointer">
              <input type="checkbox" id="removeDuplicates" class="accent-teal-400 w-3.5 h-3.5 rounded" />
              <span>Deduplicate</span>
            </label>
          </div>
        </div>
      </div>

      <!-- Primary Actions Grid -->
      <div class="grid grid-cols-2 gap-3 pt-2">
        <button onclick="generateImposition()" class="primary mono text-xs uppercase py-3 rounded-md shadow-lg transition-transform active:scale-95">
          ✨ Process & Generate
        </button>
        <button onclick="clearAll()" class="secondary mono text-xs uppercase py-3 rounded-md transition">
          🗑️ Clear All
        </button>
      </div>

      <!-- Output Workspace Workspace -->
      <div id="outputWorkspace" class="hidden pt-4 border-t border-white/10 space-y-3">
        
        <!-- Toolbar Bar -->
        <div class="flex flex-wrap justify-between items-center gap-2">
          <span id="counterLabel" class="mono text-xs text-teal-300 font-bold">Generated 0 lines</span>
          <div class="flex items-center gap-2">
            <button id="copyBtn" onclick="copyToClipboard()" class="copy-btn px-3 py-1.5 rounded-md mono text-xs font-bold flex items-center gap-1">
              📋 Copy
            </button>
            <button onclick="downloadAsTextFile()" class="secondary px-3 py-1.5 rounded-md mono text-xs font-semibold flex items-center gap-1">
              💾 Download .txt
            </button>
          </div>
        </div>

        <!-- Real-time Filter inside Output -->
        <div>
          <input type="text" id="outputFilter" oninput="filterOutputLines()" placeholder="🔍 Live search/filter output..." class="w-full rounded-md p-2 text-xs mono bg-[#08111a]" />
        </div>

        <!-- Output Display Box -->
        <div id="displayArea" class="bg-[#08111a] p-4 rounded-md border border-white/5 max-h-[300px] overflow-y-auto font-mono text-xs leading-relaxed text-slate-200 whitespace-pre-wrap break-words"></div>
      </div>

    </div>
  </div>

<script>
const MAX_LIMIT = 10000; 
let formattedText = "";
let rawOutputLines = [];
let currentMode = "single"; // 'single', 'multi', 'sequence'

const countInput = document.getElementById('repeatCount');
const sourceText = document.getElementById('sourceText');

document.getElementById('separatorType').addEventListener('change', (e) => {
  document.getElementById('customSeparatorContainer').classList.toggle('hidden', e.target.value !== 'custom');
});

function setMode(mode) {
  currentMode = mode;
  document.querySelectorAll('[id^="modeBtn"]').forEach(btn => {
    btn.classList.remove('bg-[#17304a]', 'text-teal-300');
    btn.classList.add('text-slate-400');
  });

  if (mode === 'single') {
    document.getElementById('modeBtnSingle').classList.add('bg-[#17304a]', 'text-teal-300');
    document.getElementById('inputLabel').innerText = "Enter your line of text:";
    sourceText.placeholder = "Type your single phrase here...";
    document.getElementById('sequenceHint').classList.add('hidden');
    countInput.disabled = false;
  } else if (mode === 'multi') {
    document.getElementById('modeBtnMulti').classList.add('bg-[#17304a]', 'text-teal-300');
    document.getElementById('inputLabel').innerText = "Enter Multi-Line List / Items:";
    sourceText.placeholder = "Item 1\nItem 2\nItem 3...";
    document.getElementById('sequenceHint').classList.add('hidden');
    countInput.disabled = false;
  } else if (mode === 'sequence') {
    document.getElementById('modeBtnSequence').classList.add('bg-[#17304a]', 'text-teal-300');
    document.getElementById('inputLabel').innerText = "Sequence Template:";
    sourceText.placeholder = "server_node_{i}.internal";
    document.getElementById('sequenceHint').classList.remove('hidden');
    countInput.disabled = false;
  }
}

function updateInputStats() {
    const text = sourceText.value;
    document.getElementById('charCount').innerText = `${text.length} characters`;
    const words = text.trim() ? text.trim().split(/\s+/).length : 0;
    document.getElementById('wordCount').innerText = `${words} words`;
}

function togglePrefixOptions() {
    const isChecked = document.getElementById('enablePrefix').checked;
    document.getElementById('prefixOptionsPanel').classList.toggle('hidden', !isChecked);
}

function toggleSuffixOptions() {
    const isChecked = document.getElementById('enableSuffix').checked;
    document.getElementById('suffixOptionsPanel').classList.toggle('hidden', !isChecked);
}

function toggleTransformOptions() {
    const isChecked = document.getElementById('enableTransform').checked;
    document.getElementById('transformPanel').classList.toggle('hidden', !isChecked);
}

function toggleCustomSymbolInput() {
    const type = document.getElementById('prefixType').value;
    document.getElementById('customSymbolContainer').classList.toggle('hidden', type !== 'custom');
}

function clearAll() {
    sourceText.value = '';
    document.getElementById('outputWorkspace').classList.add('hidden');
    document.getElementById('outputFilter').value = '';
    formattedText = '';
    rawOutputLines = [];
    updateInputStats();
}

function toRoman(num) {
    const lookup = {M:1000,CM:900,D:500,CD:400,C:100,XC:90,L:50,XL:40,X:10,IX:9,V:5,IV:4,I:1};
    let roman = '';
    for (let i in lookup) {
        while (num >= lookup[i]) {
            roman += i;
            num -= lookup[i];
        }
    }
    return roman;
}

function toAlpha(num) {
    let result = '';
    while (num > 0) {
        let mod = (num - 1) % 26;
        result = String.fromCharCode(65 + mod) + result;
        num = Math.floor((num - mod) / 26);
    }
    return result;
}

function generateImposition() {
    let text = sourceText.value;
    let count = parseInt(countInput.value);

    if (!text) {
        alert("Please enter some text to process!");
        return;
    }

    if (isNaN(count) || count < 1) count = 1;
    if (count > MAX_LIMIT) {
        alert(`Limit capped at ${MAX_LIMIT}.`);
        count = MAX_LIMIT;
        countInput.value = MAX_LIMIT;
    }

    const usePrefix = document.getElementById('enablePrefix').checked;
    const prefixType = document.getElementById('prefixType').value;
    const customSymbol = document.getElementById('customSymbol').value;

    const useSuffix = document.getElementById('enableSuffix').checked;
    const customSuffix = document.getElementById('customSuffix').value;

    const useTransform = document.getElementById('enableTransform').checked;
    const textCase = document.getElementById('textCase').value;
    const sortOrder = document.getElementById('sortOrder').value;
    const findText = document.getElementById('findText').value;
    const replaceText = document.getElementById('replaceText').value;
    const trimWhitespace = document.getElementById('trimWhitespace').checked;
    const removeDuplicates = document.getElementById('removeDuplicates').checked;

    let baseItems = [];

    if (currentMode === 'single') {
        for (let i = 0; i < count; i++) baseItems.push(text);
    } else if (currentMode === 'multi') {
        const splitLines = text.split('\n');
        for (let i = 0; i < count; i++) {
            baseItems.push(...splitLines);
        }
    } else if (currentMode === 'sequence') {
        for (let i = 1; i <= count; i++) {
            baseItems.push(text.replaceAll('{i}', i));
        }
    }

    let processedLines = baseItems.map((item, index) => {
        let line = item;

        if (useTransform && findText) {
            line = line.replaceAll(findText, replaceText);
        }

        if (useTransform && trimWhitespace) {
            line = line.trim();
        }

        if (useTransform) {
            if (textCase === 'uppercase') line = line.toUpperCase();
            else if (textCase === 'lowercase') line = line.toLowerCase();
            else if (textCase === 'capitalize') {
                line = line.replace(/\b\w/g, l => l.toUpperCase());
            }
        }

        return line;
    });

    if (useTransform && removeDuplicates) {
        processedLines = [...new Set(processedLines)];
    }

    if (useTransform) {
        if (sortOrder === 'reverse') processedLines.reverse();
        else if (sortOrder === 'shuffle') {
            processedLines.sort(() => Math.random() - 0.5);
        }
    }

    // Apply Prefixes & Suffixes
    const padLength = processedLines.length.toString().length;

    rawOutputLines = processedLines.map((line, i) => {
        let idx = i + 1;
        let pfx = "";
        let sfx = useSuffix ? customSuffix : "";

        if (usePrefix) {
            if (prefixType === 'numbers') pfx = `${idx}. `;
            else if (prefixType === 'padded') pfx = `${String(idx).padStart(padLength, '0')}. `;
            else if (prefixType === 'roman') pfx = `${toRoman(idx)}. `;
            else if (prefixType === 'alpha') pfx = `${toAlpha(idx)}. `;
            else pfx = customSymbol;
        }

        return `${pfx}${line}${sfx}`;
    });

    renderFinalOutput();
    document.getElementById('outputWorkspace').classList.remove('hidden');
}

function renderFinalOutput() {
    const separatorType = document.getElementById('separatorType').value;
    let joiner = "\n";
    if (separatorType === 'comma') joiner = ", ";
    else if (separatorType === 'semicolon') joiner = "; ";
    else if (separatorType === 'space') joiner = " ";
    else if (separatorType === 'custom') joiner = document.getElementById('customSeparator').value;

    const filterTerm = document.getElementById('outputFilter').value.toLowerCase();
    const filteredLines = rawOutputLines.filter(line => line.toLowerCase().includes(filterTerm));

    formattedText = filteredLines.join(joiner);

    document.getElementById('displayArea').innerText = formattedText;
    document.getElementById('counterLabel').innerText = `Generated ${filteredLines.length} output entries`;
    
    const copyBtn = document.getElementById('copyBtn');
    copyBtn.innerText = "📋 Copy";
    copyBtn.classList.remove('copied');
}

function filterOutputLines() {
    if (rawOutputLines.length) renderFinalOutput();
}

function downloadAsTextFile() {
    if (!formattedText) return;
    const blob = new Blob([formattedText], { type: 'text/plain;charset=utf-8' });
    const link = document.createElement('a');
    link.href = URL.createObjectURL(blob);
    link.download = `imposition_output_${Date.now()}.txt`;
    link.click();
}

// Mobile-Proof Copy Engine
function copyToClipboard() {
    if (!formattedText) return;

    const copyBtn = document.getElementById('copyBtn');

    if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(formattedText).then(() => {
            showSuccessState(copyBtn);
        }).catch(() => {
            runFallbackCopy(copyBtn);
        });
    } else {
        runFallbackCopy(copyBtn);
    }
}

function runFallbackCopy(btnElement) {
    const tempTextArea = document.createElement('textarea');
    tempTextArea.value = formattedText;
    tempTextArea.style.position = 'fixed';
    tempTextArea.style.left = '-999999px';
    tempTextArea.style.top = '-999999px';
    document.body.appendChild(tempTextArea);
    
    tempTextArea.focus();
    tempTextArea.select();
    tempTextArea.setSelectionRange(0, 999999);

    try {
        const success = document.execCommand('copy');
        if (success) showSuccessState(btnElement);
        else alert("Failed to copy automatically.");
    } catch (err) {
        alert("Clipboard access denied.");
    }
    
    document.body.removeChild(tempTextArea);
}

function showSuccessState(btn) {
    btn.innerText = "✓ Copied!";
    btn.classList.add('copied');
    setTimeout(() => {
        btn.innerText = "📋 Copy";
        btn.classList.remove('copied');
    }, 2500);
}
</script>
</body>
</html>

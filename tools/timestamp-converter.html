<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Timestamp Converter — Utility Hub</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Inter:wght@400;500&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
</style>
  <script src="../style.js" data-uh-page-type="tool" data-uh-title="Timestamp Converter"></script>
</head>
<body>
  <main class="uh-container uh-container--narrow">
    <div class="uh-page-head">
      <h1 class="uh-page-title">Timestamp Converter</h1>
      <p class="uh-page-sub">Switch between Unix timestamps and human-readable dates and times.</p>
    </div>

    <div class="uh-card mb-4">
      <label class="uh-label mono text-xs uppercase block mb-1">Unix timestamp (seconds)</label>
      <input id="unix" type="number" class="uh-input w-full rounded-md p-3 text-sm mono" />
    </div>
    <div class="uh-card mb-4">
      <label class="uh-label mono text-xs uppercase block mb-1">Date &amp; time (local)</label>
      <input id="datetime" type="datetime-local" class="uh-input w-full rounded-md p-3 text-sm mono" />
    </div>
    <button id="now" class="uh-btn uh-btn--primary mono text-xs uppercase px-4 py-2 rounded-md">Use current time</button>
  </main>

  <script>
    const unix = document.getElementById('unix');
    const datetime = document.getElementById('datetime');

    function toLocalInputValue(date) {
      const off = date.getTimezoneOffset();
      return new Date(date.getTime() - off * 60000).toISOString().slice(0, 16);
    }

    function setFromDate(date) {
      unix.value = Math.floor(date.getTime() / 1000);
      datetime.value = toLocalInputValue(date);
    }

    unix.addEventListener('input', () => {
      if (!unix.value) return;
      setFromDate(new Date(Number(unix.value) * 1000));
    });
    datetime.addEventListener('input', () => {
      if (!datetime.value) return;
      const date = new Date(datetime.value);
      unix.value = Math.floor(date.getTime() / 1000);
    });
    document.getElementById('now').addEventListener('click', () => setFromDate(new Date()));

    setFromDate(new Date());
  </script>
</body>
</html>

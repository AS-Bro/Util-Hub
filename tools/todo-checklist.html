<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Todo Checklist — Utility Hub</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Inter:wght@400;500&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  .done { text-decoration: line-through; opacity: 0.5; }
  html body.uh-tool .filter-tab.active { background:var(--uh-accent); color:var(--uh-bg); }
  .priority-high { color:var(--uh-danger); border-color:color-mix(in srgb, var(--uh-danger) 35%, transparent); background:color-mix(in srgb, var(--uh-danger) 12%, transparent); }
  .priority-medium { color:var(--uh-warning); border-color:color-mix(in srgb, var(--uh-warning) 35%, transparent); background:color-mix(in srgb, var(--uh-warning) 12%, transparent); }
  .priority-low { color:var(--uh-muted); border-color:var(--uh-line); background:var(--uh-panel); }
  .uh-progress-track { background:var(--uh-elevated); }
  .uh-progress-fill { background:var(--uh-success); }
</style>
  <script src="../style.js" data-uh-page-type="tool" data-uh-title="Todo Checklist"></script>
</head>
<body>
  <main class="uh-container uh-container--narrow">
    <div class="uh-page-head">
      <h1 class="uh-page-title">Todo Checklist</h1>
      <p class="uh-page-sub">Manage tasks with priorities, due dates, categories, and local autosave.</p>
    </div>

    <!-- Progress Bar -->
    <div class="uh-card mb-6">
      <div class="flex justify-between items-center mb-2">
        <span class="uh-label mono text-xs uppercase">Task Completion</span>
        <span id="statsText" class="mono text-xs text-[var(--uh-accent)] font-bold">0% (0/0)</span>
      </div>
      <div class="uh-progress-track w-full h-2 rounded-full overflow-hidden">
        <div id="progressBar" class="uh-progress-fill h-full transition-all duration-300" style="width: 0%"></div>
      </div>
    </div>

    <!-- Task Input Form -->
    <form id="form" class="uh-card flex flex-col gap-3 mb-6">
      <div class="flex gap-2">
        <input id="input" type="text" placeholder="What needs to be done?" class="uh-input flex-1 rounded-md p-3 text-sm" />
        <button type="submit" class="uh-btn uh-btn--primary mono text-xs uppercase px-5 py-2.5 rounded-md font-semibold">Add Task</button>
      </div>

      <div class="grid grid-cols-1 sm:grid-cols-3 gap-2 pt-1">
        <!-- Priority -->
        <div>
          <label class="uh-label mono text-[10px] uppercase block mb-1">Priority</label>
          <select id="priority" class="uh-select w-full rounded-md p-2 text-xs mono">
            <option value="low">Low Priority</option>
            <option value="medium" selected>Medium Priority</option>
            <option value="high">High Priority</option>
          </select>
        </div>

        <!-- Category -->
        <div>
          <label class="uh-label mono text-[10px] uppercase block mb-1">Category</label>
          <select id="category" class="uh-select w-full rounded-md p-2 text-xs mono">
            <option value="General" selected>General</option>
            <option value="Work">Work</option>
            <option value="Personal">Personal</option>
            <option value="Ideas">Ideas</option>
          </select>
        </div>

        <!-- Due Date -->
        <div>
          <label class="uh-label mono text-[10px] uppercase block mb-1">Due Date</label>
          <input id="dueDate" type="date" class="uh-input w-full rounded-md p-2 text-xs mono" />
        </div>
      </div>
    </form>

    <!-- Toolbar: Filters & Search -->
    <div class="flex flex-wrap items-center justify-between gap-3 mb-4">
      <!-- Status Tabs -->
      <div class="uh-toolbar flex gap-1">
        <button data-filter="all" class="uh-btn uh-btn--primary filter-tab active mono text-xs px-3 py-1">All</button>
        <button data-filter="active" class="uh-btn uh-btn--secondary filter-tab mono text-xs px-3 py-1">Active</button>
        <button data-filter="completed" class="uh-btn uh-btn--secondary filter-tab mono text-xs px-3 py-1">Completed</button>
      </div>

      <!-- Search Input -->
      <input id="search" type="text" placeholder="Search tasks..." class="uh-input rounded-md px-3 py-1.5 text-xs mono w-full sm:w-48" />
    </div>

    <!-- Task List -->
    <ul id="list" class="space-y-2.5 mb-6"></ul>

    <!-- Bottom Actions Toolbar -->
    <div class="uh-toolbar flex flex-wrap items-center justify-between gap-3 pt-3">
      <div class="flex gap-2">
        <button id="toggleAll" class="uh-btn uh-btn--secondary mono text-[11px] uppercase px-3 py-1.5 rounded-md">Mark All Completed</button>
        <button id="clearCompleted" class="uh-btn uh-btn--danger mono text-[11px] uppercase px-3 py-1.5 rounded-md">Clear Completed</button>
      </div>

      <div class="flex gap-2">
        <input type="file" id="importFile" class="hidden" accept=".json" />
        <button id="importBtn" class="uh-btn uh-btn--secondary mono text-[11px] uppercase px-2.5 py-1.5 rounded-md">Import</button>
        <button id="exportBtn" class="uh-btn uh-btn--secondary mono text-[11px] uppercase px-2.5 py-1.5 rounded-md">Export</button>
      </main>
    </div>
  </div>

  <script>
    const KEY = 'utilityhub-tool:todo-checklist';
    const list = document.getElementById('list');
    const form = document.getElementById('form');
    const input = document.getElementById('input');
    const prioritySelect = document.getElementById('priority');
    const categorySelect = document.getElementById('category');
    const dueDateInput = document.getElementById('dueDate');
    const searchInput = document.getElementById('search');
    const progressBar = document.getElementById('progressBar');
    const statsText = document.getElementById('statsText');

    let currentFilter = 'all';

    function load() {
      try { return JSON.parse(localStorage.getItem(KEY)) || []; } catch { return []; }
    }
    function save(items) { localStorage.setItem(KEY, JSON.stringify(items)); }

    function getPriorityBadge(priority) {
      if (priority === 'high') return '<span class="uh-badge priority-high mono text-[9px] uppercase">High</span>';
      if (priority === 'medium') return '<span class="uh-badge priority-medium mono text-[9px] uppercase">Med</span>';
      return '<span class="uh-badge priority-low mono text-[9px] uppercase">Low</span>';
    }

    function render() {
      const items = load();
      const searchQuery = searchInput.value.toLowerCase().trim();

      // Stats calculation
      const total = items.length;
      const completedCount = items.filter(i => i.done).length;
      const pct = total === 0 ? 0 : Math.round((completedCount / total) * 100);
      progressBar.style.width = `${pct}%`;
      statsText.textContent = `${pct}% (${completedCount}/${total})`;

      // Filter logic
      const filtered = items.filter((item) => {
        const matchesFilter = 
          currentFilter === 'all' || 
          (currentFilter === 'active' && !item.done) || 
          (currentFilter === 'completed' && item.done);
        
        const matchesSearch = item.text.toLowerCase().includes(searchQuery) || 
                              (item.category && item.category.toLowerCase().includes(searchQuery));
        
        return matchesFilter && matchesSearch;
      });

      if (filtered.length === 0) {
        list.innerHTML = `<li class="uh-card border-dashed text-center text-sm text-[var(--uh-muted)] p-8">No tasks found.</li>`;
        return;
      }

      const todayStr = new Date().toISOString().split('T')[0];

      list.innerHTML = filtered.map((item) => {
        const actualIndex = items.indexOf(item);
        const isOverdue = item.dueDate && item.dueDate < todayStr && !item.done;

        return `
          <li class="uh-panel flex items-center gap-3 p-3.5 transition-all">
            <input type="checkbox" data-i="${actualIndex}" class="uh-checkbox check" ${item.done ? 'checked' : ''} />
            
            <div class="flex-1 min-w-0">
              <div class="flex items-center gap-2 mb-0.5">
                <span data-i="${actualIndex}" class="task-text text-sm cursor-pointer ${item.done ? 'done' : ''} break-words">${item.text.replace(/</g, '&lt;')}</span>
              </div>
              
              <div class="flex flex-wrap items-center gap-2 mt-1">
                ${getPriorityBadge(item.priority)}
                <span class="uh-badge mono text-[9px] uppercase">${item.category || 'General'}</span>
                ${item.dueDate ? `
                  <span class="mono text-[10px] ${isOverdue ? 'text-[var(--uh-danger)] font-bold' : 'text-[var(--uh-muted)]'}">
                    📅 ${item.dueDate} ${isOverdue ? '(Overdue)' : ''}
                  </span>
                ` : ''}
              </div>
            </div>

            <button data-i="${actualIndex}" class="uh-btn uh-btn--danger remove mono text-xs p-1" title="Delete Task">✕</button>
          </li>
        `;
      }).join('');
    }

    // Add Task
    form.addEventListener('submit', (e) => {
      e.preventDefault();
      const text = input.value.trim();
      if (!text) return;

      const items = load();
      items.push({
        text,
        done: false,
        priority: prioritySelect.value,
        category: categorySelect.value,
        dueDate: dueDateInput.value || null,
        createdAt: new Date().toISOString()
      });

      save(items);
      input.value = '';
      dueDateInput.value = '';
      render();
    });

    // List Actions
    list.addEventListener('click', (e) => {
      const check = e.target.closest('.check');
      const remove = e.target.closest('.remove');
      const items = load();

      if (check) {
        items[check.dataset.i].done = check.checked;
        save(items);
        render();
      }

      if (remove) {
        items.splice(remove.dataset.i, 1);
        save(items);
        render();
      }
    });

    // Filter Tabs
    document.querySelectorAll('.filter-tab').forEach(tab => {
      tab.addEventListener('click', (e) => {
        document.querySelectorAll('.filter-tab').forEach(t => {
          t.className = 'uh-btn uh-btn--secondary filter-tab mono text-xs px-3 py-1';
        });
        e.target.className = 'uh-btn uh-btn--primary filter-tab active mono text-xs px-3 py-1';
        currentFilter = e.target.dataset.filter;
        render();
      });
    });

    // Search
    searchInput.addEventListener('input', render);

    // Bulk Actions
    document.getElementById('toggleAll').addEventListener('click', () => {
      const items = load();
      const allDone = items.every(i => i.done);
      items.forEach(i => i.done = !allDone);
      save(items);
      render();
    });

    document.getElementById('clearCompleted').addEventListener('click', () => {
      const items = load().filter(i => !i.done);
      save(items);
      render();
    });

    // Import & Export
    document.getElementById('exportBtn').addEventListener('click', () => {
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(load(), null, 2));
      const a = document.createElement('a');
      a.href = dataStr;
      a.download = `todo-backup-${new Date().toISOString().split('T')[0]}.json`;
      a.click();
    });

    const importFile = document.getElementById('importFile');
    document.getElementById('importBtn').addEventListener('click', () => importFile.click());
    importFile.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = (evt) => {
          try {
            const imported = JSON.parse(evt.target.result);
            if (Array.isArray(imported)) {
              save(imported);
              render();
            }
          } catch (err) {}
        };
        reader.readAsText(file);
      }
    });

    render();
  </script>
</body>
</html>
